/camera_node:
  ros__parameters:
    camera_info_url: package://rm_vision_bringup/config/camera_info.yaml
    exposure_time: 6000
    gain: 8.0
    frame_rate: 46.0

/serial_driver:
  ros__parameters:
    timestamp_offset: 0.006
    device_name: /dev/ttyACM0
    baud_rate: 115200
    flow_control: none
    parity: none
    stop_bits: "1"

/armor_detector:
  ros__parameters:
    # Enable image diagnostics only while tuning the detector.
    debug: false

    # true: 使用 YOLOv8-OBB(TensorRT)；false: 使用传统 CV 检测器
    use_yolo: true
    yolo.conf_threshold: 0.25
    yolo.nms_threshold: 0.5
    # 3V3: 只识别哨兵(guard) + 步兵(1~5)；留空 [] 则识别全部 18 类
    yolo.target_numbers: ["guard", "1", "2", "3", "4", "5"]

    detect_color: 0
    binary_thres: 30

    light.min_ratio: 0.1
    armor.min_light_ratio: 0.8

    classifier_threshold: 0.8
    ignore_classes: ["negative"]

/armor_tracker:
  ros__parameters:
    target_frame: odom
    max_armor_distance: 10.0

    ekf:
      sigma2_q_xyz: 0.05
      sigma2_q_yaw: 5.0
      sigma2_q_r: 80.0

      r_xyz_factor: 4e-4
      r_yaw: 5e-3

    tracker:
      max_match_distance: 0.5
      max_match_yaw_diff: 1.0

      tracking_thres: 5
      lost_time_thres: 1.0
